
name: Build and Deploy netcore-crud

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: netcorecrudacr
  ACR_LOGIN_SERVER: netcorecrudacr-hgacdrcygxczf4ak.azurecr.io
  IMAGE_NAME: netcore-crud
  WEBAPP_NAME: netcore-crud-web
  RESOURCE_GROUP: netcore-crud-rg
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4

      # Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Setup Node.js for npm dependencies
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: netcore-crud/package-lock.json

      # Install npm dependencies
      - name: Install npm dependencies
        working-directory: ./netcore-crud
        run: npm ci

      # Restore .NET dependencies
      - name: Restore
        run: dotnet restore ./netcore-crud/netcore-crud.csproj

      # Build .NET project
      - name: Build
        run: dotnet build ./netcore-crud/netcore-crud.csproj --configuration Release --no-restore

      # Authenticate with Azure using OIDC
      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Verify the active Azure subscription
      - name: Verify Azure subscription
        run: |
          az account show \
            --query "{name:name, id:id}" \
            --output table

      # Verify that the expected ACR exists
      - name: Verify Azure Container Registry
        run: |
          az acr show \
            --name "$ACR_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{name:name, loginServer:loginServer}" \
            --output table

      # Authenticate Docker with ACR
      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      # Build Docker image using the netcore-crud folder with a unique commit SHA
      - name: Build Docker image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            ./netcore-crud

          # Add the latest tag to the same image
          docker tag \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"

          # Add a version tag when a Git version tag is pushed
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            docker tag \
              "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
              "$ACR_LOGIN_SERVER/$IMAGE_NAME:$VERSION"
          fi

      # Push all applicable tags to ACR
      - name: Push Docker image
        run: |
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:$VERSION"
          fi

  deploy:
    name: Deploy to Azure App Service
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # Authenticate with Azure using OIDC
      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Explicitly select the target subscription
      - name: Select Azure subscription
        run: |
          az account set \
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      # Verify the App Service exists
      - name: Verify Azure App Service
        run: |
          az webapp show \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{name:name, state:state, host:defaultHostName}" \
            --output table

      # Configure App Service to use the newly pushed image
      - name: Update App Service container
        run: |
          DEPLOY_TAG="$IMAGE_TAG"

          # Use the version tag for official releases
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            DEPLOY_TAG="${GITHUB_REF#refs/tags/}"
          fi

          echo "Deploying image: $ACR_LOGIN_SERVER/$IMAGE_NAME:$DEPLOY_TAG"

          az webapp config container set \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --container-image-name "$ACR_LOGIN_SERVER/$IMAGE_NAME:$DEPLOY_TAG" \
            --container-registry-url "https://$ACR_LOGIN_SERVER"


      # Restart the application
      - name: Restart App Service
        run: |
          az webapp restart \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP"

      # Confirm deployment configuration
      - name: Verify deployed container
        run: |
          az webapp config container show \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --output json
